name: Research Integrity Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'cold/**'
      - 'live/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR promotion path and ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          head_ref='${{ github.head_ref }}'
          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          if [[ "$head_ref" != promote/* ]]; then
            echo "::error::PRs into main must originate from promote/*, not $head_ref"
            exit 1
          fi
          git fetch origin '${{ github.base_ref }}' '${{ github.head_ref }}' --quiet || true
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          if [[ "$merge_base" != "$base_sha" ]]; then
            echo "::error::Promotion head is not based on the exact current PR base main SHA. Reconstruct/rebase the promotion from current main."
            echo "base=$base_sha merge_base=$merge_base head=$head_sha"
            exit 1
          fi
          if git rev-list --min-parents=2 "$base_sha..$head_sha" | grep -q .; then
            echo "::error::Promotion history contains merge commits after the main base. Reconstruct the accepted delta linearly from current main instead of merging COLD/LIVE history."
            exit 1
          fi
          files="$(git diff --name-only "$base_sha...$head_sha")"
          printf '%s\n' "$files"
          promotion_count="$(grep -Ec '^docs/PROMOTIONS/[^/]+\.md$' <<<"$files" || true)"
          if [[ "$promotion_count" -ne 1 ]]; then
            echo "::error::Promotion PR must add/change exactly one docs/PROMOTIONS/*.md record; got $promotion_count."
            exit 1
          fi
          if grep -Eq '^docs/COLD/' <<<"$files"; then
            echo '::error::Promotion PR must not wholesale-import docs/COLD material.'
            exit 1
          fi

      - name: Protect canonical files on COLD/LIVE pushes
        if: github.event_name == 'push' && (startsWith(github.ref_name, 'cold/') || startsWith(github.ref_name, 'live/'))
        shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          after='${{ github.sha }}'
          if [[ "$before" == '0000000000000000000000000000000000000000' ]]; then
            git fetch origin main --quiet
            base="$(git merge-base HEAD origin/main)"
            range="$base..HEAD"
          else
            range="$before..$after"
          fi
          files="$(git diff --name-only "$range")"
          printf '%s\n' "$files"
          forbidden='^(LATEST_SYNC\.md|CLAIM_GRAPH\.json|RESEARCH_CONTRACT\.yaml|docs/(PROVEN|FALSIFIED|STATE|SYNC|NEXT|ACTIVE_CLAIMS|EVIDENCE_BOUNDARY|BRANCH_PROMOTION_POLICY)\.md|docs/PORTFOLIO_SYNC_[^/]+\.md)$'
          if grep -Eq "$forbidden" <<<"$files"; then
            echo '::error::COLD/LIVE branch attempted to modify canonical truth/control files. Use docs/COLD shadow notes or a fresh promote/* branch.'
            exit 1
          fi

      - name: Audit main push provenance and merge-time freshness
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.request

          repo = os.environ['REPO']
          sha = os.environ['SHA']
          before = os.environ['BEFORE']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'research-integrity-gate-v2.1',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode('utf-8'))

          prs = get_json(f'https://api.github.com/repos/{repo}/commits/{sha}/pulls')
          valid = []
          rejected = []
          for pr in prs:
              head_ref = str(pr.get('head', {}).get('ref', ''))
              head_sha = str(pr.get('head', {}).get('sha', ''))
              base_ref = str(pr.get('base', {}).get('ref', ''))
              base_sha = str(pr.get('base', {}).get('sha', ''))
              if not pr.get('merged_at') or base_ref != 'main' or not head_ref.startswith('promote/'):
                  rejected.append((pr.get('number'), 'route', head_ref, base_ref, base_sha, head_sha))
                  continue
              if base_sha != before:
                  rejected.append((pr.get('number'), 'base-not-immediate-previous-main', head_ref, base_sha, before, head_sha))
                  continue
              comp = get_json(f'https://api.github.com/repos/{repo}/compare/{before}...{head_sha}')
              merge_base = str(comp.get('merge_base_commit', {}).get('sha', ''))
              if merge_base != before:
                  rejected.append((pr.get('number'), 'stale-promotion-head', head_ref, before, merge_base, head_sha))
                  continue
              valid.append((pr.get('number'), head_ref, head_sha, before))

          if not valid:
              print(f'::error::main push {sha} lacks a merge-time-fresh promote/* PR based on immediate previous main {before}')
              print('rejected=', rejected)
              sys.exit(1)
          print('MAIN_PROVENANCE_FRESHNESS_PASS', valid)
          PY
