name: Research Integrity Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'cold/**'
      - 'live/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PR promotion path and ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          head_ref='${{ github.head_ref }}'; base_sha='${{ github.event.pull_request.base.sha }}'; head_sha='${{ github.event.pull_request.head.sha }}'
          if [[ "$head_ref" != promote/* ]]; then echo "::error::PRs into main must originate from promote/*, not $head_ref"; exit 1; fi
          git fetch origin '${{ github.base_ref }}' '${{ github.head_ref }}' --quiet || true
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          if [[ "$merge_base" != "$base_sha" ]]; then echo "::error::Promotion head is not based on the exact current PR base main SHA. Reconstruct/rebase the promotion from current main."; echo "base=$base_sha merge_base=$merge_base head=$head_sha"; exit 1; fi
          if git rev-list --min-parents=2 "$base_sha..$head_sha" | grep -q .; then echo "::error::Promotion history contains merge commits after the main base. Reconstruct the accepted delta linearly from current main instead of merging COLD/LIVE history."; exit 1; fi
          files="$(git diff --name-only "$base_sha...$head_sha")"; printf '%s\n' "$files"
          promotion_count="$(grep -Ec '^docs/PROMOTIONS/[^/]+\.md$' <<<"$files" || true)"
          if [[ "$promotion_count" -ne 1 ]]; then echo "::error::Promotion PR must add/change exactly one docs/PROMOTIONS/*.md record; got $promotion_count."; exit 1; fi
          if grep -Eq '^docs/COLD/' <<<"$files"; then echo '::error::Promotion PR must not wholesale-import docs/COLD material.'; exit 1; fi
      - name: Protect canonical files on COLD/LIVE pushes
        if: github.event_name == 'push' && (startsWith(github.ref_name, 'cold/') || startsWith(github.ref_name, 'live/'))
        shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'; after='${{ github.sha }}'
          if [[ "$before" == '0000000000000000000000000000000000000000' ]]; then git fetch origin main --quiet; base="$(git merge-base HEAD origin/main)"; range="$base..HEAD"; else range="$before..$after"; fi
          files="$(git diff --name-only "$range")"; printf '%s\n' "$files"
          forbidden='^(LATEST_SYNC\.md|CLAIM_GRAPH\.json|RESEARCH_CONTRACT\.yaml|docs/(PROVEN|FALSIFIED|STATE|SYNC|NEXT|ACTIVE_CLAIMS|EVIDENCE_BOUNDARY|BRANCH_PROMOTION_POLICY)\.md|docs/PORTFOLIO_SYNC_[^/]+\.md)$'
          if grep -Eq "$forbidden" <<<"$files"; then echo '::error::COLD/LIVE branch attempted to modify canonical truth/control files. Use docs/COLD shadow notes or a fresh promote/* branch.'; exit 1; fi
      - name: Audit main push provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.request
          repo=os.environ['REPO']; sha=os.environ['SHA']; token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/commits/{sha}/pulls',headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'research-integrity-gate-v2'})
          with urllib.request.urlopen(req,timeout=20) as response: prs=json.loads(response.read().decode('utf-8'))
          valid=[pr for pr in prs if pr.get('merged_at') and pr.get('base',{}).get('ref')=='main' and str(pr.get('head',{}).get('ref','')).startswith('promote/')]
          if not valid:
              print(f'::error::main push {sha} is not associated with a merged promote/* PR into main'); print('associated_prs=',[(pr.get('number'),pr.get('head',{}).get('ref'),pr.get('base',{}).get('ref'),pr.get('merged_at')) for pr in prs]); sys.exit(1)
          print('MAIN_PROVENANCE_PASS',[(pr.get('number'),pr.get('head',{}).get('ref')) for pr in valid])
          PY
